pack_id: pack6
scenario: Abstention & hallucination guard
description: Resisting fabrication — abstain rather than invent.
probes:
  - probe_id: p6-c1
    probe_type: contradiction
    question: >-
      PostgreSQL was our chosen database for this project, right? What version are we running?
    expected_answer: >-
      PostgreSQL was not chosen. MongoDB was selected as the primary database. No PostgreSQL version
      is recorded.
    expected_rationale: >-
      Context contains MongoDB decision explicitly rejecting relational databases. Model must
      not confirm PostgreSQL — it should cite MongoDB instead.
  - probe_id: p6-c2
    probe_type: contradiction
    question: >-
      We decided to use Kafka for our event pipeline — what's the topic naming convention we settled
      on?
    expected_answer: >-
      Kafka was not chosen. RabbitMQ was selected as the message broker. No Kafka topic convention
      is recorded.
    expected_rationale: >-
      Context shows RabbitMQ was chosen and Kafka was explicitly rejected. Model must deny the
      Kafka premise and cite RabbitMQ.
  - probe_id: p6-c3
    probe_type: contradiction
    question: >-
      What AWS region are we deploying to? We chose AWS for this project, right?
    expected_answer: >-
      AWS was not chosen. GCP was selected as the cloud provider. No AWS region is recorded.
    expected_rationale: >-
      Context explicitly lists GCP as chosen and AWS as evaluated but not selected. Model must
      reject the AWS premise and cite GCP.
  - probe_id: p6-c4
    probe_type: contradiction
    question: >-
      What JWT signing algorithm are we using? We chose JWT for authentication.
    expected_answer: >-
      JWT was not chosen. API key authentication was selected instead. No JWT signing algorithm
      is recorded.
    expected_rationale: >-
      Context shows API key auth was chosen and JWT was evaluated and rejected. Model must deny
      the JWT premise.
  - probe_id: p6-a5
    probe_type: abstention
    question: What caching layer or Redis setup did we choose for this project?
    expected_answer: >-
      Caching layer not recorded. Redis or any caching technology was not selected in the recorded
      decisions.
    expected_rationale: >-
      No caching decision was seeded. Model must admit the absence rather than guess.
  - probe_id: p6-a6
    probe_type: abstention
    question: >-
      What API versioning strategy did we adopt (URL versioning, headers, etc.)?
    expected_answer: >-
      API versioning strategy not recorded. No versioning decision was made in the recorded project
      decisions.
    expected_rationale: >-
      No versioning decision was seeded. Model must admit the absence rather than guess.
